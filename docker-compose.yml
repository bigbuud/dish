# Image komt uit GitHub Actions (zie .github/workflows/docker.yml).
# Lokaal bouwen i.p.v. de image ophalen: zet hieronder "build: ." bij en gebruik `docker compose up -d --build`.
services:
  dish:
    image: ghcr.io/bigbuud/dish:latest
    container_name: dish
    restart: unless-stopped
    ports:
      - "8086:3000"
    environment:
      - TZ=Europe/Brussels
      # Slimme scan (handschrift!) via Google Gemini (gratis sleutel: https://aistudio.google.com/apikey). Zonder sleutel gebruikt Dish de gewone lokale OCR.
      # - GEMINI_API_KEY=AIza...
      # - GEMINI_MODEL=gemini-3.8-flash,gemini-3.6-flash   # optioneel; kommalijst, eerste die werkt wint
      # - SESSION_DAYS=365   # hoe lang je ingelogd blijft (schuift mee bij gebruik)
    # Lukt de verbinding met Google niet ("fetch failed"/ENOTFOUND)? Haal dan de # weg: eigen DNS voor de container.
    # dns:
    #   - 1.1.1.1
    #   - 8.8.8.8
    volumes:
      - ./data:/data
